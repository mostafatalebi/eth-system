[package]
name = "eth_app"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version="2.1.1", features = ["provider-ws", "k256", "signer-local", "rand"] }
axum = { version = "0.8.9", features = ["macros"] }
chrono = {  version="0.4.45", features = ["serde"] }
clap = { version="4.6.6" , features = ["derive"]}
dotenvy = "0.15.7"
envy = "0.4.2"
postgres = "0.19.14"
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = {  version="1.0.151", features = ["std"] }
tokio = { version="1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
validator = { version = "0.21.0", features = ["derive"] }
futures-util = "0.3.33"
tracing = "0.1.44"
revm = { version = "42.0.1", features = ["alloydb"] }
flume = "0.12.0"
humantime = "2.4.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
redb = "4.2.0"
time = "0.3.55"
num-bigint = { version="0.5.1" }
bigdecimal = "0.4.10"
futures = "0.3.34"
deadpool-postgres = "0.14.2"
tokio-util = "0.7.19"

[features]
integration-tests = []